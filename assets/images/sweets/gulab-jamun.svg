<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="jamunGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8d4004"/>
      <stop offset="35%" stop-color="#561d00"/>
      <stop offset="70%" stop-color="#380d00"/>
      <stop offset="100%" stop-color="#1f0500"/>
    </radialGradient>
    <linearGradient id="syrupGaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#ffecb3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="jamunShadow">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
  </defs>

  <g filter="url(#jamunShadow)">
    <circle cx="60" cy="60" r="46" fill="url(#jamunGrad)"/>
    <!-- Shiny Syrup Reflection -->
    <ellipse cx="46" cy="42" rx="20" ry="12" fill="url(#syrupGaze)" transform="rotate(-25, 46, 42)"/>
    
    <!-- Rose Petal & Pistachio Garnish -->
    <path d="M 54,48 C 48,42 55,34 62,38 C 68,42 60,54 54,48 Z" fill="#e91e63" opacity="0.85"/>
    <ellipse cx="68" cy="46" rx="4" ry="2" fill="#4caf50" transform="rotate(30, 68, 46)"/>
  </g>
</svg>
