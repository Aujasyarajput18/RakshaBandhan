    <ellipse cx="48" cy="45" rx="15" ry="9" fill="#ffffff" opacity="0.9" transform="rotate(-20, 48, 45)"/>
    <!-- Saffron thread on top -->
    <path d="M 52,38 Q 58,35 63,40" stroke="#d84315" stroke-width="1.8" fill="none"/>
    <ellipse cx="58" cy="38" rx="2.5" ry="1.2" fill="#43a047"/>
