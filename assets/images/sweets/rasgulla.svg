<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="rasgullaGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fffde7"/>
      <stop offset="75%" stop-color="#fff9c4"/>
      <stop offset="100%" stop-color="#ffe082"/>
    </radialGradient>
    <filter id="rasgullaShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <g filter="url(#rasgullaShadow)">
