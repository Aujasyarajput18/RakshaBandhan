<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="cashewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="40%" stop-color="#fff9c4"/>
      <stop offset="80%" stop-color="#f5eedc"/>
      <stop offset="100%" stop-color="#e0d5ba"/>
    </linearGradient>
    <linearGradient id="varkSilver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e0e0e0" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#b0bec5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="sweetShadow">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <g filter="url(#sweetShadow)">
    <!-- 3D Diamond Extrusion Base -->
    <path d="M 60,18 L 105,50 L 105,62 L 60,102 L 15,62 L 15,50 Z" fill="#bcaaa4"/>
    
    <!-- Top Diamond Face -->
    <path d="M 60,18 L 105,50 L 60,88 L 15,50 Z" fill="url(#cashewGrad)" stroke="#d7ccc8" stroke-width="1.5"/>
    
    <!-- Silver Vark (Foil) Shimmer -->
    <path d="M 40,32 L 85,45 L 75,70 L 35,55 Z" fill="url(#varkSilver)" opacity="0.85"/>
    <path d="M 50,25 L 65,30 L 58,40 L 45,35 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
