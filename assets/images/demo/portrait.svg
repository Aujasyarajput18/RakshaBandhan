<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="portraitBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="40%" stop-color="#ffe082"/>
      <stop offset="80%" stop-color="#ffb300"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <filter id="portraitGlow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="rgba(255,160,0,0.5)"/>
    </filter>
  </defs>
  <circle cx="250" cy="250" r="230" fill="url(#portraitBg)" filter="url(#portraitGlow)" stroke="#ffd700" stroke-width="6"/>
  
  <!-- Festive Portrait Art of Sister with Traditional Bindi & Jhumka -->
  <g transform="translate(250,220)">
    <!-- Aura Rings -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="#ffd700" stroke-width="2" stroke-dasharray="6,6"/>
    <!-- Sister Emoji / Stylized Portrait Icon -->
    <text x="0" y="30" font-size="160" text-anchor="middle">👸🏻</text>
    <text x="0" y="140" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" text-anchor="middle" fill="#800020" letter-spacing="1">DEAREST SISTER</text>
    <text x="0" y="170" font-family="'Kalam', cursive" font-size="20" text-anchor="middle" fill="#5c0011">मेरी प्यारी बहना ❤️</text>
  </g>
</svg>
