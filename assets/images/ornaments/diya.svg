<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e65100"/>
      <stop offset="40%" stop-color="#bf360c"/>
      <stop offset="80%" stop-color="#870000"/>
      <stop offset="100%" stop-color="#4e0d00"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="50%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#f57f17"/>
    </linearGradient>
    <radialGradient id="flameGrad" cx="50%" cy="80%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff59d"/>
      <stop offset="55%" stop-color="#ff9800"/>
      <stop offset="85%" stop-color="#f44336"/>
      <stop offset="100%" stop-color="#d50000" stop-opacity="0"/>
    </radialGradient>
    <filter id="flameGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Diya Base (Clay Lamp) -->
  <g transform="translate(0, 20)">
    <!-- Base Shadow -->
    <ellipse cx="100" cy="155" rx="55" ry="12" fill="rgba(0,0,0,0.3)"/>
    
    <!-- Bowl Body -->
    <path d="M 30,110 Q 30,150 100,150 Q 170,150 170,110 Q 150,130 100,130 Q 50,130 30,110 Z" fill="url(#clayGrad)"/>
    <ellipse cx="100" cy="110" rx="70" ry="16" fill="#bf360c" stroke="url(#goldRim)" stroke-width="3"/>
    <ellipse cx="100" cy="110" rx="60" ry="11" fill="#4e0d00"/>
    
    <!-- Golden Motifs on Bowl -->
    <circle cx="100" cy="138" r="4" fill="#ffd700"/>
    <circle cx="75" cy="133" r="3.5" fill="#ffd700"/>
    <circle cx="125" cy="133" r="3.5" fill="#ffd700"/>
    <circle cx="55" cy="124" r="3" fill="#ffd700"/>
    <circle cx="145" cy="124" r="3" fill="#ffd700"/>
    
    <!-- Wick -->
    <path d="M 100,105 Q 102,90 98,80" stroke="#212121" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Glowing Flame -->
  <g filter="url(#flameGlow)">
    <path d="M 100,30 C 85,65 75,85 82,102 C 87,112 113,112 118,102 C 125,85 115,65 100,30 Z" fill="url(#flameGrad)">
      <animate attributeName="d" 
        values="M 100,30 C 85,65 75,85 82,102 C 87,112 113,112 118,102 C 125,85 115,65 100,30 Z;
                M 101,25 C 83,62 76,87 84,103 C 89,113 115,111 117,101 C 122,83 117,62 101,25 Z;
                M 99,32 C 87,67 74,83 80,101 C 85,111 111,113 119,103 C 127,87 113,67 99,32 Z;
                M 100,30 C 85,65 75,85 82,102 C 87,112 113,112 118,102 C 125,85 115,65 100,30 Z"
        dur="2s" repeatCount="indefinite"/>
    </path>
    <!-- Inner bright white flame core -->
    <path d="M 100,60 C 93,80 90,92 93,98 C 96,102 104,102 107,98 C 110,92 107,80 100,60 Z" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
