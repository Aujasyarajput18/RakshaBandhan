<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="goldGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff275" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffd700" stop-opacity="0.7"/>
      <stop offset="80%" stop-color="#d4af37" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e65100" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="70%" stop-color="#f4a300"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Glow Halo -->
  <circle cx="250" cy="250" r="230" fill="url(#goldGrad)"/>

  <g stroke="url(#goldLine)" stroke-width="1.5" fill="none" filter="url(#glow)">
    <!-- Outer Decorative Rings -->
    <circle cx="250" cy="250" r="215" stroke-dasharray="4,6" stroke-width="2"/>
    <circle cx="250" cy="250" r="200" stroke-width="1.5"/>
    <circle cx="250" cy="250" r="185" stroke-dasharray="2,4"/>
    <circle cx="250" cy="250" r="150" stroke-width="1.5"/>
    <circle cx="250" cy="250" r="110" stroke-width="2"/>
    <circle cx="250" cy="250" r="60" stroke-width="1.5"/>

    <!-- 24-spoke radial floral geometry -->
    <g transform="translate(250,250)">
      <g id="petal-group">
        <path d="M 0,-200 Q 15,-175 0,-150 Q -15,-175 0,-200 Z" fill="rgba(255,215,0,0.15)"/>
        <circle cx="0" cy="-207" r="3" fill="#ffd700"/>
        <path d="M 0,-150 Q 20,-120 0,-90 Q -20,-120 0,-150 Z" fill="rgba(244,163,0,0.2)"/>
        <circle cx="0" cy="-145" r="2" fill="#fff"/>
        <path d="M 0,-90 Q 12,-70 0,-50 Q -12,-70 0,-90 Z" fill="rgba(255,235,59,0.25)"/>
      </g>
      <use href="#petal-group" transform="rotate(15)"/>
      <use href="#petal-group" transform="rotate(30)"/>
      <use href="#petal-group" transform="rotate(45)"/>
      <use href="#petal-group" transform="rotate(60)"/>
      <use href="#petal-group" transform="rotate(75)"/>
      <use href="#petal-group" transform="rotate(90)"/>
      <use href="#petal-group" transform="rotate(105)"/>
      <use href="#petal-group" transform="rotate(120)"/>
      <use href="#petal-group" transform="rotate(135)"/>
      <use href="#petal-group" transform="rotate(150)"/>
      <use href="#petal-group" transform="rotate(165)"/>
      <use href="#petal-group" transform="rotate(180)"/>
      <use href="#petal-group" transform="rotate(195)"/>
      <use href="#petal-group" transform="rotate(210)"/>
      <use href="#petal-group" transform="rotate(225)"/>
      <use href="#petal-group" transform="rotate(240)"/>
      <use href="#petal-group" transform="rotate(255)"/>
      <use href="#petal-group" transform="rotate(270)"/>
      <use href="#petal-group" transform="rotate(285)"/>
      <use href="#petal-group" transform="rotate(300)"/>
      <use href="#petal-group" transform="rotate(315)"/>
      <use href="#petal-group" transform="rotate(330)"/>
      <use href="#petal-group" transform="rotate(345)"/>
    </g>

    <!-- Center Auspicious Lotus -->
    <circle cx="250" cy="250" r="30" fill="rgba(218,165,32,0.3)"/>
    <circle cx="250" cy="250" r="10" fill="#ffd700"/>
  </g>
</svg>
