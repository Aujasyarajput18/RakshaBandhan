<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="rakhiMoli" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b71c1c"/>
      <stop offset="25%" stop-color="#ffd600"/>
      <stop offset="50%" stop-color="#b71c1c"/>
      <stop offset="75%" stop-color="#ffd600"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>
    <radialGradient id="rubyGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ff5252"/>
      <stop offset="40%" stop-color="#d50000"/>
      <stop offset="80%" stop-color="#880e4f"/>
      <stop offset="100%" stop-color="#4a001a"/>
    </radialGradient>
    <radialGradient id="goldBead" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="80%" stop-color="#ff8f00"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <filter id="rakhiGlow">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="rgba(0,0,0,0.4)"/>
    </filter>
  </defs>

  <g filter="url(#rakhiGlow)">
    <!-- Left Sacred Thread & Tassels -->
    <path d="M 0,100 C 60,115 140,85 240,100" stroke="url(#rakhiMoli)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 0,100 C 60,90 140,110 240,100" stroke="#ffd700" stroke-width="3" stroke-dasharray="8,6" fill="none"/>
    <!-- Thread Beads Left -->
    <circle cx="160" cy="98" r="9" fill="url(#goldBead)"/>
    <circle cx="185" cy="99" r="11" fill="url(#rubyGrad)"/>
    <circle cx="215" cy="100" r="14" fill="url(#goldBead)"/>

    <!-- Right Sacred Thread & Tassels -->
    <path d="M 600,100 C 540,115 460,85 360,100" stroke="url(#rakhiMoli)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M 600,100 C 540,90 460,110 360,100" stroke="#ffd700" stroke-width="3" stroke-dasharray="8,6" fill="none"/>
    <!-- Thread Beads Right -->
    <circle cx="440" cy="98" r="9" fill="url(#goldBead)"/>
    <circle cx="415" cy="99" r="11" fill="url(#rubyGrad)"/>
    <circle cx="385" cy="100" r="14" fill="url(#goldBead)"/>

    <!-- Central Ornate Kundan Dial -->
    <g transform="translate(300,100)">
      <!-- Outer Golden Petals Base -->
      <circle cx="0" cy="0" r="62" fill="#ffd700" stroke="#e65100" stroke-width="3"/>
      
      <!-- 12 Kundan Teardrop Petals -->
      <g id="kundan-petal">
        <path d="M 0,-60 Q 8,-42 0,-30 Q -8,-42 0,-60 Z" fill="url(#rubyGrad)" stroke="#ffd700" stroke-width="1.5"/>
        <circle cx="0" cy="-60" r="3.5" fill="#fffde7"/>
      </g>
      <use href="#kundan-petal" transform="rotate(30)"/>
      <use href="#kundan-petal" transform="rotate(60)"/>
      <use href="#kundan-petal" transform="rotate(90)"/>
      <use href="#kundan-petal" transform="rotate(120)"/>
      <use href="#kundan-petal" transform="rotate(150)"/>
      <use href="#kundan-petal" transform="rotate(180)"/>
      <use href="#kundan-petal" transform="rotate(210)"/>
      <use href="#kundan-petal" transform="rotate(240)"/>
      <use href="#kundan-petal" transform="rotate(270)"/>
      <use href="#kundan-petal" transform="rotate(300)"/>
      <use href="#kundan-petal" transform="rotate(330)"/>

      <!-- Inner Pearl Ring -->
      <circle cx="0" cy="0" r="34" fill="#ffecb3" stroke="#ffd700" stroke-width="2"/>
      <circle cx="0" cy="0" r="28" fill="url(#rubyGrad)"/>
      
      <!-- Central Auspicious Diamond/Stone -->
      <circle cx="0" cy="0" r="14" fill="#ffffff" opacity="0.95"/>
      <circle cx="0" cy="0" r="10" fill="url(#goldBead)"/>
    </g>
  </g>
</svg>
